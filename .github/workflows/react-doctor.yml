# React Doctor — security, performance, correctness, and architecture checks.
# Docs: https://www.react.doctor/ci

name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/web/**"
      - ".github/workflows/react-doctor.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/react-doctor.yml"

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: millionco/react-doctor@v2
        with:
          directory: apps/web
          # Advisory gate for now: report on PRs without failing the check.
          # Graduate to blocking: error | warning when the team trusts the signal.
          blocking: none
          node-version: "22"
